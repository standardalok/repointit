<!DOCTYPE html>
<html lang="en">
    
    <head>
        <meta charset="utf-8">
        <title>
            Rock Paper Scissor Game
        </title>
        <style>
            h1{text-align:center;}
            div{text-align:center;}
            button{height:100px;
            width:100px;
        font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    font-size:larger;
border:5px;
border-radius:10px;
margin:5px
}
        </style>
    </head>
    <body> 
        
        <h1> Rock Paper Scissor Game</h1>
        <div>
            <button onclick=" let c1=cmpchoice1();  let cc1=`Rock`;won(c1,cc1)">
                Rock 
            </button>
            <button onclick="let c2=cmpchoice1();let cc2=`Paper`;won(c2,cc2)">
                Paper
            </button>
            <button onclick="let c3=cmpchoice1();let cc3=`Scissor`;won(c3,cc3)">
                Scissor
            </button>
            <button onclick="localStorage.setItem(`win`,0);localStorage.setItem(`tie`,0);localStorage.setItem(`lost`,0);
            result.win=0;result.tie=0;result.lost=0">
                Reset
            </button>
            
        </div>

        <script>
            let win_s= localStorage.getItem("win");
            let lost_s= localStorage.getItem("lost");
            let tie_s= localStorage.getItem("tie");

            
            
            if(win_s==null || lost_s==null || tie_s==null){
                localStorage.setItem("win",0);
                localStorage.setItem("tie",0);
                localStorage.setItem("lost",0);
        }
            let result={
            win:win_s,
            lost:lost_s,
            tie:tie_s,
            display:function(){
                return `number of won ${result.win} \n and lost ${result.lost} \n and tie ${result.tie}`;
            }
            } 
            let cmpchoice;
            let randomno;
            function cmpchoice1(){
                randomno=Math.random()*10;
                if(randomno>0 && randomno<=3 ){
                cmpchoice=`Rock`;
            }
            else if(randomno>3 && randomno<=7){
                cmpchoice=`Paper`
            }
            else{
                cmpchoice=`Scissor`;
            }
            return cmpchoice;
        }
        function won(x,y){
            let msg1=`You Choose Rock`;
            let msg2=`You Choose Paper`;
            let msg3=`You Choose Scissor`;
            if(x===`Rock`){
                if(y===`Rock`){
                    result.tie++;
                    alert(`${msg1} computer chooses ${x} its a tie \n and ${result.display()}`);
                }
                else if(y===`Paper`){
                    result.lost++;
                    alert(`${msg2} computer chooses ${x} computer won \n and ${result.display()}`);
                }
                else{
                    result.win++;                    
                    alert(`${msg3} computer chooses ${x} you won \n ${result.display()}`);
                } 
            }
            else if(x===`Scissor`){
                if(y===`Rock`){
                    result.win++;
                    alert(`${msg1} computer chooses ${x} you won \n and ${result.display()}`);
                }
                else if(y===`Paper`){
                    result.lost++
                    alert(`${msg2} computer chooses ${x} computer won \n and ${result.display()}`);
                }
                else{
                    result.tie++;
                    alert(`${msg3} computer chooses ${x} its a tie \n and ${result.display()}`);
                } 
            }
            if(x===`Paper`){
                if(y===`Rock`){
                    result.lost++;
                    alert(`${msg1} computer chooses ${x} computer won \n and${result.display()}`);
                }
                else if(y===`Paper`){
                    result.tie++;
                    alert(`${msg2} computer chooses ${x} its a tie \n and ${result.display()}`);
                }
                else{
                    result.win++;
                    alert(`${msg3} computer chooses ${x} you won \n and ${result.display()}`);
                } 
            }
        localStorage.setItem("win",result.win);
        localStorage.setItem("tie",result.tie);
        localStorage.setItem("lost",result.lost);
        }

        </script>
    </body>
</html>
