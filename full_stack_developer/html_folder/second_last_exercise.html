<!DOCTYPE Html>
<htm lang="en">
    <head>
        <meta charset="utf-8">
        <title>
            json ,local storage and date and dom exercise
        </title>
        <link rel="stylesheet" href="/full_stack_developer/css_folder/second_last_exercise_css.css">
        <style>
            #message{
                font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                font-size:larger;
                text-align:center;
            }
            a{
                text-decoration:none;
            }
            .odd{
                background-color:aqua;
            }
            .even{
                background-color:red;
            }
            #b1{
                width:100px;
                height:100px;
                text-align:center;
                font-size:larger;
                }
            #b2{
                display:flex;
                justify-content:center;
            }

        </style>
    </head>
    <body>
    <a href="/html_folder/myntra_bag_exercise.html"><div id ="message">good morning</div></a>
    <div id="b2">
        <button id="b1" onclick="clicked();"></button>
    </div>
        <script>
            let b1=document.querySelector("#b1");
            let count=localStorage.getItem("count");
            if(count==null){
                localStorage.setItem("count",0);
            }
            b1.innerText=count;
            function clicked(){
            count++; 
            b1.innerText=count
            if(count%2==0){
            b1.classList.add("even");
            b1.classList.remove("odd")
            }
            else{
            b1.classList.add("odd");
            b1.classList.remove("even")
            }
            localStorage.setItem("count",count);
            }
            clicked();
            let b=new Date();
            let c=document.querySelector("#message")
            if (b.getHours()<=12){
                c.innerText="Good Mornng";
            }
            else if(b.getHours()>=12||b.getHours()<=20 ){
                c.innerText="Good afternoon";
            }
            else{
                c.innerText="Good night";
            }            
        </script>
    </body>
</html>
