<!Doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <style>
            h1{
                text-align:center;
            }
        </style>
    </head>
    <body>
        <h1>JSON learning explicitly</h1>
        <script>
            let product={
                company:"alok",
                price:80
            };
            console.log(product);
            console.log(typeof product);
            let stringform=JSON.stringify(product);
            console.log(typeof stringform);
            console.log(stringform);
            let n=JSON.parse(stringform);
            console.log(n);

            localStorage.setItem("name","alok");
            localStorage.setItem("class","bca");
            let m =localStorage.getItem("name");
            console.log(m);
            console.log(localStorage.getItem("class"));
        </script>
    </body>
</html>
